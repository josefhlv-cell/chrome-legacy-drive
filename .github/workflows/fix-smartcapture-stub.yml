name: Fix SmartCapture stub
on:
  workflow_dispatch:
  push:
    paths:
      - "src/pages/SmartCapture.tsx"
      - ".github/workflows/fix-smartcapture-stub.yml"
jobs:
  strip-stub:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove trailing stub if present
        run: |
          python3 << 'EOF'
          from pathlib import Path
          p = Path("src/pages/SmartCapture.tsx")
          t = p.read_text(encoding="utf-8")
          idx = t.find("DOČASNÝ STUB")
          if idx < 0:
              print("no stub marker")
              raise SystemExit(0)
          start = t.rfind("/**", 0, idx)
          if start < 0:
              print("comment start not found")
              raise SystemExit(0)
          if t.count("export default function SmartCapture") < 2:
              print("only one export, leave as-is")
              raise SystemExit(0)
          p.write_text(t[:start].rstrip() + "\n", encoding="utf-8")
          print("stub removed, new size", p.stat().st_size)
          EOF
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SmartCapture.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Odstranění DOČASNÝ STUB ze SmartCapture.tsx"
            git push
          fi
