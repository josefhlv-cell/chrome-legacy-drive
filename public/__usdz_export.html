<!doctype html><html><body>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import { GLTFLoader } from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/DRACOLoader.js';
import { USDZExporter } from 'https://esm.sh/three@0.170.0/examples/jsm/exporters/USDZExporter.js';
const loader = new GLTFLoader();
const d = new DRACOLoader(); d.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/'); loader.setDRACOLoader(d);
loader.load('/models/pacifica-ar.glb', async (g) => {
  try {
    const exporter = new USDZExporter();
    const arr = await exporter.parseAsync(g.scene, { maxTextureSize: 2048 });
    let bin = ''; const u8 = new Uint8Array(arr);
    for (let i=0;i<u8.length;i+=0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000));
    window.__usdz = btoa(bin);
    window.__done = u8.length;
  } catch(e) { window.__err = String(e); }
}, undefined, e => { window.__err = 'load: '+e });
</script></body></html>
